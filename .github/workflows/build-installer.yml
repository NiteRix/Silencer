name: Build installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check panel and host scripts parse
        run: node scripts/check-syntax.mjs
      - name: Run tests
        run: node scripts/test.mjs
      - name: Check shell installers parse
        run: |
          bash -n Install-Mac.command
          bash -n Uninstall-Mac.command

  zip:
    name: Portable zip
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Stage payload
        run: |
          VERSION="$(grep -oP 'ExtensionBundleVersion="\K[^"]+' extension/CSXS/manifest.xml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "stage/Silencer-$VERSION"
          cp -R extension "stage/Silencer-$VERSION/"
          cp Install-Windows.bat Uninstall-Windows.bat \
             Install-Mac.command Uninstall-Mac.command \
             README.md LICENSE "stage/Silencer-$VERSION/"
          chmod +x "stage/Silencer-$VERSION"/*.command
      - name: Zip
        run: |
          mkdir -p dist
          (cd stage && zip -qr "../dist/Silencer-$VERSION-portable.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: Silencer-portable-zip
          path: dist/*.zip

  windows-setup:
    name: Windows .exe
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        shell: pwsh
        run: |
          $xml = [xml](Get-Content extension/CSXS/manifest.xml)
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$($xml.ExtensionManifest.ExtensionBundleVersion)"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # ${env:ProgramFiles(x86)} needs the braces around the whole name -
          # "$env:ProgramFiles(x86)" expands the variable and leaves "(x86)"
          # sitting there as literal text.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) {
            Write-Host "ISCC.exe not found. Looked in:"
            $candidates | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Using $iscc"

          & $iscc "/DSourceRoot=$($PWD.Path)" "/DAppVersion=$env:VERSION" `
                  "installer\windows\silencer-setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $built = Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue
          if (-not $built) { Write-Error "ISCC reported success but produced no .exe"; exit 1 }
          $built | ForEach-Object { Write-Host "Built $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Silencer-windows-setup
          path: dist/*.exe

  release:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: [zip, windows-setup]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show what will be attached
        run: find artifacts -type f -printf '%s\t%p\n' | sort -rn
      - name: Derive version
        # Assets are named from the manifest version (1.0.0), the tag carries
        # a leading v (v1.0.0) - the body needs the bare number to name files.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: Silencer ${{ github.ref_name }}
          # Publishing a release with no installers attached would be worse
          # than failing, because the download links would just be missing.
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
          body: |
            Removes the silence from a Premiere Pro timeline, after duplicating
            the sequence into a backup bin.

            ## Download

            | You are on | Get |
            |---|---|
            | **Windows** | `Silencer-${{ env.VERSION }}-Setup.exe` — run it, restart Premiere |
            | **macOS** | `Silencer-${{ env.VERSION }}-portable.zip` — unpack, double-click `Install-Mac.command`, restart Premiere |

            The portable zip also works on Windows if you would rather not run
            an installer: unpack it and double-click `Install-Windows.bat`.

            Both install into your own user folder, so there is no admin prompt.
            Neither is signed with an Adobe certificate, so the installer also
            switches on CEP's "allow unsigned extensions" setting — that is
            what makes the panel load at all.

            Then open it from **Window > Extensions > Silencer**.

            ## Notes

            - Premiere Pro 14.0 (2020) or newer for cutting. 13.x can analyse
              and place markers but cannot move clips from a script.
            - ffmpeg is optional. The installer offers to fetch it; it covers
              ProRes, DNxHD and other codecs the built-in decoder cannot read.
            - Nothing leaves your machine, and nothing is cut until you press
              **Cut the silence**.

            Full README: https://github.com/NiteRix/Silencer/blob/${{ github.ref_name }}/README.md
            Trouble: https://github.com/NiteRix/Silencer/blob/${{ github.ref_name }}/docs/TROUBLESHOOTING.md
