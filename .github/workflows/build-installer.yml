name: Build installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check panel and host scripts parse
        run: node scripts/check-syntax.mjs
      - name: Run tests
        run: node scripts/test.mjs
      - name: Check shell installers parse
        run: |
          bash -n Install-Mac.command
          bash -n Uninstall-Mac.command

  zip:
    name: Portable zip
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Stage payload
        run: |
          VERSION="$(grep -oP 'ExtensionBundleVersion="\K[^"]+' extension/CSXS/manifest.xml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "stage/Silencer-$VERSION"
          cp -R extension "stage/Silencer-$VERSION/"
          cp Install-Windows.bat Uninstall-Windows.bat \
             Install-Mac.command Uninstall-Mac.command \
             README.md LICENSE "stage/Silencer-$VERSION/"
          chmod +x "stage/Silencer-$VERSION"/*.command
      - name: Zip
        run: |
          mkdir -p dist
          (cd stage && zip -qr "../dist/Silencer-$VERSION-portable.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: Silencer-portable-zip
          path: dist/*.zip

  windows-setup:
    name: Windows .exe
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        shell: pwsh
        run: |
          $xml = [xml](Get-Content extension/CSXS/manifest.xml)
          $v = $xml.ExtensionManifest.ExtensionBundleVersion
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" `
              "/DSourceRoot=$pwd" "/DAppVersion=$env:VERSION" `
              installer\windows\silencer-setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Silencer-windows-setup
          path: dist/*.exe

  release:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: [zip, windows-setup]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
