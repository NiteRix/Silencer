name: Build installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to cut a release at, e.g. v1.0.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check panel and host scripts parse
        run: node scripts/check-syntax.mjs
      - name: Run tests
        run: node scripts/test.mjs
      - name: Check shell installers parse
        run: |
          bash -n Install-Mac.command
          bash -n Uninstall-Mac.command

  ffmpeg:
    name: Minimal ffmpeg (win64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Cache the built binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          # Rebuilding takes minutes, and only changes when the recipe or the
          # pinned ffmpeg tag does.
          key: ffmpeg-win64-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Install toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 nasm
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh windows ffmpeg-out/ffmpeg.exe
      - name: Report size
        run: ls -l ffmpeg-out/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffmpeg-out/

  zip:
    name: Portable zip
    runs-on: ubuntu-latest
    needs: [check, ffmpeg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: extension/bin
      - name: Stage payload
        run: |
          VERSION="$(grep -oP 'ExtensionBundleVersion="\K[^"]+' extension/CSXS/manifest.xml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          chmod +x extension/bin/ffmpeg.exe 2>/dev/null || true
          mkdir -p "stage/Silencer-$VERSION"
          cp -R extension "stage/Silencer-$VERSION/"
          cp Install-Windows.bat Uninstall-Windows.bat \
             Install-Mac.command Uninstall-Mac.command \
             README.md LICENSE "stage/Silencer-$VERSION/"
          chmod +x "stage/Silencer-$VERSION"/*.command
      - name: Zip
        run: |
          mkdir -p dist
          (cd stage && zip -qr "../dist/Silencer-$VERSION-portable.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: Silencer-portable-zip
          path: dist/*.zip

  windows-setup:
    name: Windows .exe
    runs-on: windows-latest
    needs: [check, ffmpeg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: extension/bin
      - name: Confirm ffmpeg is in the payload
        shell: pwsh
        run: |
          $ff = "extension/bin/ffmpeg.exe"
          if (-not (Test-Path $ff)) { Write-Error "ffmpeg.exe missing - the installer would ship without it"; exit 1 }
          "{0:N1} MB  {1}" -f ((Get-Item $ff).Length / 1MB), $ff
      - name: Read version from manifest
        shell: pwsh
        run: |
          $xml = [xml](Get-Content extension/CSXS/manifest.xml)
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$($xml.ExtensionManifest.ExtensionBundleVersion)"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # ${env:ProgramFiles(x86)} needs the braces around the whole name -
          # "$env:ProgramFiles(x86)" expands the variable and leaves "(x86)"
          # sitting there as literal text.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) {
            Write-Host "ISCC.exe not found. Looked in:"
            $candidates | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Using $iscc"

          & $iscc "/DSourceRoot=$($PWD.Path)" "/DAppVersion=$env:VERSION" `
                  "installer\windows\silencer-setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $built = Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue
          if (-not $built) { Write-Error "ISCC reported success but produced no .exe"; exit 1 }
          $built | ForEach-Object { Write-Host "Built $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Silencer-windows-setup
          path: dist/*.exe

  release:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: [zip, windows-setup]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show what will be attached
        run: find artifacts -type f -printf '%s\t%p\n' | sort -rn
      - name: Checksums
        run: |
          # Only the installers. ffmpeg-win64 is an input to those builds, not
          # something anyone should download on its own.
          cd artifacts
          sha256sum Silencer-portable-zip/*.zip Silencer-windows-setup/*.exe \
            | sed 's|[^ ]*/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Resolve tag
        # On a tag push the ref is the tag; on a manual run it comes from the
        # input, and action-gh-release creates the tag at this commit. Assets
        # are named from the manifest version (1.0.0) while the tag carries a
        # leading v, so the body needs the bare number to name files.
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Refusing to release at '$TAG' - expected something like v1.0.0"; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Silencer ${{ env.TAG }}
          # Publishing a release with no installers attached would be worse
          # than failing, because the download links would just be missing.
          fail_on_unmatched_files: true
          files: |
            artifacts/Silencer-portable-zip/*.zip
            artifacts/Silencer-windows-setup/*.exe
            artifacts/SHA256SUMS.txt
          body: |
            Removes the silence from a Premiere Pro timeline, after duplicating
            the sequence into a backup bin.

            ## Download

            | You are on | Get |
            |---|---|
            | **Windows** | `Silencer-${{ env.VERSION }}-Setup.exe` — run it, restart Premiere |
            | **macOS** | `Silencer-${{ env.VERSION }}-portable.zip` — unpack, double-click `Install-Mac.command`, restart Premiere |

            The portable zip also works on Windows if you would rather not run
            an installer: unpack it and double-click `Install-Windows.bat`.

            Both install into your own user folder, so there is no admin prompt.
            Neither is signed with an Adobe certificate, so the installer also
            switches on CEP's "allow unsigned extensions" setting — that is
            what makes the panel load at all.

            Then open it from **Window > Extensions > Silencer**.

            ## Notes

            - Premiere Pro 14.0 (2020) or newer for cutting. 13.x can analyse
              and place markers but cannot move clips from a script.
            - **ffmpeg is built in on Windows.** Nothing is downloaded during
              install. It is a purpose-built 7 MB audio-only binary rather than
              upstream's 127 MB one, LGPL v2.1, with the licence and the exact
              build recipe shipped beside it. On macOS, `brew install ffmpeg`
              and Silencer will find it.
            - Windows will warn that the installer is unsigned, and antivirus
              may scan the bundled ffmpeg the first time it runs. Both are
              expected — [the troubleshooting guide explains
              why](https://github.com/NiteRix/Silencer/blob/${{ env.TAG }}/docs/TROUBLESHOOTING.md).
            - Nothing leaves your machine, and nothing is cut until you press
              **Cut the silence**.

            Verify a download against `SHA256SUMS.txt` if you want to.

            Full README: https://github.com/NiteRix/Silencer/blob/${{ env.TAG }}/README.md
            Trouble: https://github.com/NiteRix/Silencer/blob/${{ env.TAG }}/docs/TROUBLESHOOTING.md
